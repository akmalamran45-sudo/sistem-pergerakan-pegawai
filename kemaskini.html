<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemaskini Pergerakan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .form-container { background: white; max-width: 400px; margin: auto; padding: 25px 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2d3748; margin-top: 0; }
        label { font-size: 14px; font-weight: bold; color: #4a5568; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; box-sizing: border-box; background-color: #f8fafc; }
        input:focus, select:focus { outline: none; border-color: #3182ce; background-color: #fff; }
        .btn-submit { width: 100%; margin-top: 25px; padding: 15px; background-color: #3182ce; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #2b6cb0; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #a0aec0; text-decoration: none; font-size: 14px; }

</head>
<body>
